ai_conversation.settings:
  type: config_object
  label: 'AI Conversation Settings'
  mapping:
    default_provider:
      type: string
      label: 'Default AI Provider'
      description: 'Primary GenAI backend (bedrock or ollama)'
      default: 'bedrock'
    
    enable_user_provider_selection:
      type: boolean
      label: 'Enable User Provider Selection'
      description: 'Allow users to override site default provider (Forseti-specific feature)'
      default: false
    
    context_provider:
      type: string
      label: 'Context Provider Type'
      description: 'Type of context (job_search for Forseti, campaign for DungeonCrawler)'
      default: 'job_search'
    
    available_contexts:
      type: sequence
      label: 'Available Contexts'
      description: 'List of context types this site supports'
      sequence:
        type: string

ai_conversation.provider_settings:
  type: config_object
  label: 'AI Provider Settings'
  mapping:
    bedrock:
      type: mapping
      label: 'AWS Bedrock Settings'
      mapping:
        region:
          type: string
          label: 'AWS Region'
          default: 'us-east-1'
        model_id:
          type: string
          label: 'Default Model ID'
          default: 'anthropic.claude-3-sonnet-20240229-v1:0'
        max_tokens:
          type: integer
          label: 'Max Tokens'
          default: 2048
    
    ollama:
      type: mapping
      label: 'Ollama Settings'
      mapping:
        endpoint:
          type: string
          label: 'Ollama API Endpoint'
          description: 'e.g., http://localhost:11434'
          default: 'http://localhost:11434'
        model:
          type: string
          label: 'Default Model Name'
          description: 'e.g., llama2, mistral'
          default: 'llama2'
        timeout_seconds:
          type: integer
          label: 'API Timeout (seconds)'
          default: 30
